<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Recipes</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                Recipe Finder
            </a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="search.html">Search</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="favorites.html">Favorites</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- ================= PAGE TITLE ================= -->

    <div class="container mt-5 text-center">

        <h1>Search Recipes</h1>

        <p>
            Search recipes using ingredients, cuisine or meal type.
        </p>

    </div>

    <!-- ================= SEARCH AREA ================= -->

    <div class="container mt-4">

        <div class="card p-4">

            <div class="row">

                <div class="col-md-4">

                    <label class="mb-2">Ingredient</label>

                    <input
                        type="text"
                        id="ingredient"
                        class="form-control"
                        placeholder="Example : Chicken">

                </div>

                <div class="col-md-3">

                    <label class="mb-2">Cuisine</label>

                    <select id="cuisine" class="form-select">

                        <option value="">Select</option>

                        <option>Indian</option>
                        <option>Italian</option>
                        <option>Chinese</option>
                        <option>Mexican</option>
                        <option>American</option>

                    </select>

                </div>

                <div class="col-md-3">

                    <label class="mb-2">Meal Type</label>

                    <select id="meal" class="form-select">

                        <option value="">Select</option>

                        <option>Breakfast</option>
                        <option>Lunch</option>
                        <option>Dinner</option>
                        <option>Snack</option>

                    </select>

                </div>

                <div class="col-md-2 d-flex align-items-end">

                    <button
                        class="btn btn-warning w-100"
                        onclick="searchRecipe()">

                        Search

                    </button>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= LOADING ================= -->

    <div class="container mt-4">

        <div id="loading" class="text-center">

        </div>

    </div>

    <!-- ================= RECIPES ================= -->

    <div class="container mt-5">

        <div class="row" id="recipeContainer">

            <!-- Recipe Cards will appear here -->

        </div>

    </div>

    <!-- ================= FOOTER ================= -->

    <footer class="mt-5 p-4 text-center">

        <h5>Intelligent Recipe Discovery System</h5>

        <p>
            Developed by Mayan khobragade (EE24TCS001)
        </p>

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript -->

    <script src="search.js"></script>

</body>

</html>
